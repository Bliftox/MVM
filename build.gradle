plugins {
    id 'com.github.johnrengelman.shadow' version '7.1.2'
    id 'fabric-loom' version '1.6.9'
    id 'maven-publish'
}
sourceCompatibility = JavaVersion.VERSION_17
targetCompatibility = JavaVersion.VERSION_17

archivesBaseName = project.archives_base_name
version = project.mod_version
group = project.maven_group

repositories {
    maven {
        url = "https://m2.dv8tion.net/releases/"
        content { includeGroup "net.dv8tion" }
    }
    maven {
        url = "https://maven.nucleoid.xyz/"
        content { includeGroup "eu.pb4" }
    }
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        url = 'https://maven.cafeteria.dev'
        content {
            includeGroup 'net.adriantodt.fabricmc'
        }
    }
    maven { url "https://maven.jamieswhiteshirt.com/libs-release/" }
    maven { url "https://maven.shedaniel.me/" }
    maven { url 'https://maven.nucleoid.xyz' }
    maven { url 'https://oss.sonatype.org/content/repositories/snapshots' }
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    include(implementation("net.dv8tion:JDA:5.0.0-beta.24") {
        exclude module: "opus-java"
    })
    include(implementation("net.sf.trove4j:core:3.1.0"))
    include(implementation("org.apache.commons:commons-collections4:4.4"))
    include(implementation("org.slf4j:slf4j-api:2.0.13")) // 1.x is Incompatible with Quilt (#164)
    include(implementation("com.neovisionaries:nv-websocket-client:2.14"))
    include(implementation("com.fasterxml.jackson.core:jackson-core:2.17.0"))
    include(implementation("com.fasterxml.jackson.core:jackson-databind:2.17.0"))
    include(implementation("com.fasterxml.jackson.core:jackson-annotations:2.17.0"))
    include(implementation("com.squareup.okhttp3:okhttp:4.12.0"))
    include(implementation("com.squareup.okio:okio-jvm:3.6.0"))
//    modImplementation("org.jetbrains.kotlin:kotlin-stdlib:1.8.21")
//
//    modImplementation("net.fellbaum:jemoji:1.3.4") // File size of 1.4.x is too big
//
//    modImplementation("com.google.code.gson:gson:2.11.0")
//    implementation "com.squareup.okhttp3:okhttp:4.9.3"
//    implementation "com.squareup.okio:okio:2.8.0"
//    modImplementation "org.xerial:sqlite-jdbc:3.44.1.0"//shadowCommon "org.xerial:sqlite-jdbc:3.44.1.0"
//    modImplementation "mysql:mysql-connector-java:8.0.33"
//    shadowCommon "com.squareup.okhttp3:okhttp:4.12.0"




    include(implementation("mysql:mysql-connector-java:8.0.30"))
    include(implementation("org.xerial:sqlite-jdbc:3.44.1.0"))
//    include(implementation("org.apache.commons:commons-collections4:4.4"))
//    include(implementation("com.squareup.okhttp3:okhttp:4.12.0"))
//    include(implementation("com.squareup.okio:okio-jvm:3.6.0"))
//    include(implementation("com.neovisionaries:nv-websocket-client:2.14"))

//    implementation("mysql:mysql-connector-java:8.0.30")
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 17
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release = targetJavaVersion
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    archivesBaseName = project.archives_base_name
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}"}
    }
}

// configure the maven publication
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
shadowJar {  zip64 true}
